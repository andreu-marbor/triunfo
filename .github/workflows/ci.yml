# CI — pruebas + build en los PULL REQUESTS (Fase 7: los pushes a `main`
# ya los cubre `despliegue.yml`, que hace prueba → build → Pages; aquí se
# evita duplicar trabajo, decisión anticipada en la Fase 1).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (i18n)
        run: npm run prueba

      - name: Build de producción
        run: npm run build
